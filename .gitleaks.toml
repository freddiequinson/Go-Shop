title = "Go-Shop secret detection"

[extend]
useDefault = true

[allowlist]
description = "Binary assets that cannot contain executable configuration"
paths = [
  '''(?i)\.(?:avif|eot|gif|ico|jpe?g|mp4|png|ttf|webm|webp|woff2?)$''',
  '''(?:^|/)\.git/''',
  '''(?:^|/)\.next/''',
  '''(?:^|/)\.pytest_cache/''',
  '''(?:^|/)node_modules/''',
]

[[rules]]
id = "credentialed-database-uri"
description = "Database URI containing an embedded credential"
regex = '''(?i)\b(?:postgres|postgresql|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss)://[^\s:/@]+:[^\s/@]+@[^\s]+'''
tags = ["database", "credential"]

[rules.allowlist]
description = "Documented non-production placeholders"
regexes = [
  '''(?i)://goshop_user:REPLACE_WITH_MANAGED_DATABASE_PASSWORD@''',
  '''(?i)://test_user:test_password@''',
  '''(?i)://audit:audit@127\.0\.0\.1:5432/audit''',
  '''(?i)://user:password@''',
  '''(?i)://goshop_user:\$\{DB_PASSWORD:-goshop_password_2024\}@''',
]

[[rules]]
id = "sensitive-environment-assignment"
description = "Sensitive Go-Shop environment variable with a concrete value"
regex = '''(?i)\b(?:(?:PAYSTACK_SECRET_KEY\s*=\s*["']?sk_(?:live|test)_[A-Za-z0-9]{20,})|(?:GOOGLE_CLIENT_SECRET\s*=\s*["']?GOCSPX-[A-Za-z0-9_-]{20,})|(?:FACEBOOK_CLIENT_SECRET\s*=\s*["']?[0-9a-f]{32,})|(?:HUBTEL_CLIENT_SECRET\s*=\s*["']?[A-Za-z0-9]{8,64})|(?:SMTP_PASSWORD\s*=\s*["']?[a-z]{16})|(?:(?:SECRET_KEY|JWT_SECRET_KEY)\s*=\s*["']?[A-Za-z0-9+/]{42,}={0,2})|(?:GROQ_API_KEY\s*=\s*["']?gsk_[A-Za-z0-9]{20,}))'''
tags = ["environment", "credential"]

[rules.allowlist]
description = "Documentation placeholders are not credentials"
regexes = [
  '''(?i)(?:replace|placeholder|example|dummy|your)[A-Za-z0-9_./+=-]*''',
]
