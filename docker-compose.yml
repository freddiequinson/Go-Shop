version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: goshop-db
    environment:
      POSTGRES_USER: goshop_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-goshop_password_2024}
      POSTGRES_DB: goshopghana
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshop_user -d goshopghana"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: goshop-backend
    environment:
      DATABASE_URL: postgresql://goshop_user:${DB_PASSWORD:-goshop_password_2024}@db:5432/goshopghana
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      HUBTEL_CLIENT_ID: ${HUBTEL_CLIENT_ID}
      HUBTEL_CLIENT_SECRET: ${HUBTEL_CLIENT_SECRET}
      HUBTEL_SENDER_ID: ${HUBTEL_SENDER_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      BACKEND_CORS_ORIGINS: '["https://yourdomain.com","https://www.yourdomain.com"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  launch-ejs:
    image: node:20-alpine
    container_name: goshop-launch-ejs
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./frontend/launch-ejs:/app
    expose:
      - "3001"
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        LAUNCH_EJS_ORIGIN: ${LAUNCH_EJS_ORIGIN:-http://launch-ejs:3001}
    container_name: goshop-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      LAUNCH_EJS_ORIGIN: ${LAUNCH_EJS_ORIGIN:-http://launch-ejs:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - launch-ejs
    restart: unless-stopped

volumes:
  postgres_data:
