name: Release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/test_db
      SECRET_KEY: test-only-signing-key
      JWT_SECRET_KEY: test-only-jwt-key
      PAYSTACK_SECRET_KEY: test-only-paystack-secret
      PAYSTACK_PUBLIC_KEY: test-only-paystack-public
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend release tests
        working-directory: backend
        run: python -m pytest -p no:cacheprovider tests
      - name: Run Compose contract tests
        run: python -m pytest -p no:cacheprovider tests/test_compose_contract.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Refuse production dependency vulnerabilities
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
