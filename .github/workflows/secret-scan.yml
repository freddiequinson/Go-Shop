name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove the detector works
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-canary"
          printf '%s%s\n' 'postgresql://canary-user:' 'canary-password@db.invalid/app' \
            > "$RUNNER_TEMP/gitleaks-canary/input.txt"

          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/gitleaks-canary:/scan:ro" \
            -v "$GITHUB_WORKSPACE/.gitleaks.toml:/gitleaks.toml:ro" \
            "$GITLEAKS_IMAGE" detect --no-git --source=/scan \
            --config=/gitleaks.toml --redact --no-banner >/dev/null 2>&1
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "Secret scanner canary failed with status $status"
            exit 1
          fi

      - name: Refuse credentials in the complete history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-report"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks-report:/report" \
            "$GITLEAKS_IMAGE" detect --source=/repo \
            --config=/repo/.gitleaks.toml --redact --no-banner \
            --log-opts=--all --report-format=json \
            --report-path=/report/history.json

      - name: Refuse credentials in the checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-report"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$RUNNER_TEMP/gitleaks-report:/report" \
            "$GITLEAKS_IMAGE" detect --no-git --source=/repo \
            --config=/repo/.gitleaks.toml --redact --no-banner \
            --report-format=json --report-path=/report/tree.json
